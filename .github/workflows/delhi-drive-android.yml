name: Build Delhi Drive Android APK
on:
  workflow_dispatch:
  push:
    branches: [ai-copywriting-agent]
    paths:
      - 'delhi-drive/**'
      - '.github/workflows/delhi-drive-android.yml'
permissions:
  contents: read
  actions: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build APK with configured Android SDK
        run: |
          docker run --rm -v "${{ github.workspace }}:/root/project" barichello/godot-ci:4.4.1 bash -lc '
            set -e
            test -d /usr/lib/android-sdk/platform-tools
            test -d /usr/lib/android-sdk/build-tools/33.0.2
            test -d /usr/lib/android-sdk/platforms/android-33
            test -f /usr/lib/jvm/java-17-openjdk-amd64/bin/java
            test -f /root/debug.keystore
            mkdir -p "$HOME/.config/godot"
            cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
[gd_resource type="EditorSettings" format=3]
[resource]
export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
export/android/android_sdk_path = "/usr/lib/android-sdk"
export/android/debug_keystore = "/root/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
export/android/force_system_user = false
export/android/shutdown_adb_on_exit = true
EOF
            cd /root/project/delhi-drive
            mkdir -p build
            godot --headless --path . --editor --quit --verbose
            godot --headless --path . --export-debug "Android" build/DelhiDrive-debug.apk --verbose
            test -s build/DelhiDrive-debug.apk
            file build/DelhiDrive-debug.apk
          '
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Delhi-Drive-Android-APK
          path: delhi-drive/build/DelhiDrive-debug.apk
          if-no-files-found: error
          retention-days: 30
