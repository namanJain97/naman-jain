name: Build Delhi Drive Android APK
on:
  workflow_dispatch:
  push:
    branches: [ai-copywriting-agent]
    paths:
      - 'delhi-drive/**'
      - '.github/workflows/delhi-drive-android.yml'
permissions:
  contents: read
  actions: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build APK with matching Godot export templates
        run: |
          docker run --rm -v "${{ github.workspace }}:/root/project" barichello/godot-ci:4.4.1 bash -lc '
            set -e
            VERSION="4.4.1.stable"
            mkdir -p "$HOME/.local/share/godot/export_templates/$VERSION"
            cd /tmp
            wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O templates.tpz
            unzip -q templates.tpz -d templates
            cp -a templates/templates/. "$HOME/.local/share/godot/export_templates/$VERSION/"
            cd /root/project/delhi-drive
            mkdir -p build
            godot --headless --path . --editor --quit
            godot --headless --path . --export-debug "Android" build/DelhiDrive-debug.apk
            test -s build/DelhiDrive-debug.apk
            file build/DelhiDrive-debug.apk
          '
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Delhi-Drive-Android-APK
          path: delhi-drive/build/DelhiDrive-debug.apk
          if-no-files-found: error
          retention-days: 30
